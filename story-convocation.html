<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>WhatsApp Story - Convocation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(180deg, #FAF8F5 0%, #F5F0E8 100%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 60px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative elements */
        .decoration-top {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: #C9A962;
        }

        .decoration-bottom {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: #C9A962;
        }

        /* Content */
        .office-label {
            font-size: 28px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #722F37;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 72px;
            color: #2C2C2C;
            margin-bottom: 80px;
            font-weight: 500;
        }

        .announcement {
            font-size: 32px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #722F37;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .event-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 52px;
            color: #2C2C2C;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 20px;
            max-width: 900px;
        }

        .event-subtitle {
            font-size: 30px;
            color: #666;
            margin-bottom: 100px;
            letter-spacing: 1px;
        }

        .date-box {
            background: #722F37;
            color: #FAF8F5;
            padding: 50px 100px;
            margin-bottom: 60px;
        }

        .date-label {
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .date-value {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 56px;
            font-weight: 500;
        }

        .times-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-bottom: 100px;
        }

        .time-primary {
            background: #C9A962;
            color: #2C2C2C;
            padding: 30px 80px;
            font-size: 44px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .time-primary span {
            font-size: 28px;
            font-weight: 400;
            opacity: 0.8;
            margin-left: 15px;
        }

        .time-secondary {
            display: flex;
            gap: 60px;
        }

        .time-item {
            text-align: center;
        }

        .time-zone {
            font-size: 22px;
            letter-spacing: 3px;
            color: #999;
            margin-bottom: 8px;
        }

        .time-value {
            font-size: 32px;
            color: #2C2C2C;
            font-weight: 500;
        }

        .cta {
            font-size: 28px;
            color: #722F37;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 25px 60px;
            border: 2px solid #722F37;
        }

        .website {
            position: absolute;
            bottom: 120px;
            font-size: 26px;
            color: #999;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="decoration-top"></div>

    <p class="office-label">The Office of</p>
    <h1 class="name">Mudit Lal</h1>

    <p class="announcement">Delivering the</p>
    <h2 class="event-title">Fall 2025 Convocation Speech</h2>
    <p class="event-subtitle">Fulton Schools of Engineering, ASU</p>

    <div class="date-box">
        <p class="date-label">Date</p>
        <p class="date-value">December 18, 2025</p>
    </div>

    <div class="times-container">
        <div class="time-primary">
            2:40 AM <span>IST (Dec 19)</span>
        </div>
        <div class="time-secondary">
            <div class="time-item">
                <p class="time-zone">MST</p>
                <p class="time-value">2:10 PM</p>
            </div>
            <div class="time-item">
                <p class="time-zone">EST</p>
                <p class="time-value">4:10 PM</p>
            </div>
        </div>
    </div>

    <div class="cta">Watch Live</div>

    <p class="website">muditlal.com/live</p>

    <div class="decoration-bottom"></div>
</body>
</html>
