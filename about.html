<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Prevent flash of wrong theme
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About Mudit Lal - Founder, engineer and designer from Lucknow, Bharat. Building ventures that serve communities across India.">
    <meta name="author" content="Mudit Lal">

    <meta property="og:title" content="About | The Office of Mudit Lal">
    <meta property="og:description" content="Mudit Lal is a founder, engineer and designer from Lucknow, Bharat. Building ventures that serve communities across India.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://muditlal.com/about">
    <meta property="og:image" content="https://muditlal.com/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:creator" content="@mudit_lal">

    <link rel="canonical" href="https://muditlal.com/about">

    <!-- Theme Color -->
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/98d66e4736.js" crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4HSVES0V4H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4HSVES0V4H');
    </script>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <a href="/" class="nav-brand">
            <span class="nav-brand-label">The Office of</span>
            <span class="nav-brand-name">Mudit Lal</span>
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/about" class="nav-link active">About</a></li>
            <li><a href="/press" class="nav-link">Recognition</a></li>
            <li><a href="mailto:office@muditlal.com" class="nav-link">Contact</a></li>
        </ul>

        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg class="moon-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="nav-toggle" id="navToggle" onclick="toggleNav()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="about-page">
        <!-- About Header -->
        <header class="about-header">
            <p class="about-office-name">The Office of Mudit Lal</p>
            <h1 class="about-title">About</h1>
        </header>

        <div class="about-container">
            <p class="about-coming-soon">Will be updated soon.</p>

            <!-- Footer -->
            <footer class="footer about-footer">
                <p class="footer-office">The Office of Mudit Lal</p>
                <p class="footer-location">Lucknow, Bharat (India)</p>
                <p class="footer-contact">For inquiries or event invitations: <a href="mailto:office@muditlal.com">office@muditlal.com</a></p>
            </footer>
        </div>
    </main>

    <script>
        // Mobile Navigation Toggle
        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('active');
            document.getElementById('navToggle').classList.toggle('active');
        }

        // Close nav when clicking a link (mobile)
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
                document.getElementById('navToggle').classList.remove('active');
            });
        });

        // Theme Toggle
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            // Check for saved theme preference or default to light
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            }

            themeToggle.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);

                // GA4 Event: Theme Toggle
                gtag('event', 'theme_toggle', {
                    'theme': newTheme
                });
            });
        })();

        // GA4 Event Tracking
        (function() {
            // Contact clicks
            document.querySelectorAll('a[href^="mailto:"]').forEach(link => {
                link.addEventListener('click', () => {
                    gtag('event', 'contact_click', {
                        'method': 'email'
                    });
                });
            });
        })();
    </script>
</body>
</html>
